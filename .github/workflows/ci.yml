name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Fast, CPU-only, offline. The test suite depends only on the PyTorch stack
# (see [project].dependencies); TensorFlow is an optional extra and is never
# installed here. Both 3.11 and 3.12 have CPU torch wheels, so the matrix is
# green on both — no TF-on-3.12 caveat applies because TF is not used in CI.
jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Byte-compile
        run: python -m compileall edge_ai_compression src tests

      - name: Tests
        run: pytest -q

      - name: Config validation (smoke)
        run: |
          python -m edge_ai_compression.config.validate \
            edge_ai_compression/configs/experiments/smoke_cpu.yml

      - name: Offline demo (smoke)
        run: python -m edge_ai_compression.demo --quick
