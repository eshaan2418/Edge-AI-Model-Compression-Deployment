[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-compression"
version = "0.1.0"
description = "Hardware-aware neural network compression and AutoML for edge deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.65",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
    "memory-profiler>=0.61",
    "psutil>=5.9",
]

# TensorFlow/Keras stack for the original root scripts (train_baseline.py,
# benchmark.py, quantize_model.py, distill_model.py). Not needed for the
# PyTorch framework or the test suite. `tf-mot` adds the pruning toolkit used
# by prune_model.py.
[project.optional-dependencies]
tf = ["tensorflow>=2.16", "tf-keras>=2.16"]
tf-mot = ["tensorflow>=2.16", "tf-keras>=2.16", "tensorflow-model-optimization>=0.8"]
viz = ["matplotlib>=3.8"]
docs = ["mkdocs>=1.6"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = ["edge-ai-compression[tf-mot,viz,docs,dev]"]

[project.scripts]
auto-compress = "edge_ai_compression.auto_compress:main"
mc = "src.model_compression.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edge_ai_compression*", "src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
