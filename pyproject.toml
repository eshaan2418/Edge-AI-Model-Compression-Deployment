[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-compression"
version = "0.1.0"
description = "Hardware-aware neural network compression and AutoML for edge deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.65",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
    "memory-profiler>=0.61",
    "psutil>=5.9",
]

# TensorFlow/Keras stack for the frozen legacy TFLite scripts in legacy/tflite/
# (train_baseline.py, benchmark.py, quantize_model.py, distill_model.py). Not
# needed for the PyTorch framework or the test suite. `tf-mot` adds the pruning
# toolkit used by legacy/tflite/prune_model.py.
[project.optional-dependencies]
tf = ["tensorflow>=2.16", "tf-keras>=2.16"]
tf-mot = ["tensorflow>=2.16", "tf-keras>=2.16", "tensorflow-model-optimization>=0.8"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=7.4", "ruff==0.16.8"]
# Build tooling for the C++ kernels (scripts/build_kernels.sh).
kernels = ["nanobind>=2.4", "cmake>=3.26", "ninja>=1.11"]
# PyTorch -> ONNX export and the ONNX Runtime backend.
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]
all = ["edge-ai-compression[tf-mot,viz,dev,kernels,export]"]

[project.scripts]
auto-compress = "edge_ai_compression.auto_compress:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edge_ai_compression*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
