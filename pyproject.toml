[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-compression"
version = "0.1.0"
description = "Hardware-aware neural network compression and AutoML for edge deployment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.65",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
    "memory-profiler>=0.61",
    "psutil>=5.9",
]

[project.optional-dependencies]
tf = ["tensorflow>=2.15", "keras>=3.0"]
viz = ["matplotlib>=3.8"]

[project.scripts]
auto-compress = "edge_ai_compression.auto_compress:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edge_ai_compression*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
