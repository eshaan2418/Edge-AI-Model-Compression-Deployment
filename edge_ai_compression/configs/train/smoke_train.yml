# Offline smoke test of the trainer: a few steps on synthetic data, 3 checkpoints.
model: resnet18_cifar
dataset: fake
limit_samples: 32
batch_size: 8
num_workers: 0
device: cpu
seed: 0
epochs: 2
lr: 0.05
warmup_epochs: 0.5
num_checkpoints: 3
checkpoint_dir: models/smoke_checkpoints
results_dir: results/smoke
log_every_steps: 2
