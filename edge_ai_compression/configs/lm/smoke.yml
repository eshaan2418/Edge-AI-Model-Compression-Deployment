# Offline smoke test of the small-LM lifecycle: tiny GPT on synthetic stories,
# pretrain -> SFT -> DPO -> distilled draft -> quantization ladder + speculative row.
size: gpt_tiny
draft: gpt_tiny
data: synthetic
limit: 200
device: cpu
seed: 0
batch_size: 8
lr: 0.003
steps: {pretrain: 30, sft: 10, dpo: 4, distill: 10}
eval_stories: 20
constraint_examples: 4
max_new: 40
methods: [fp, w8a8, w4a16_g32]
results_dir: results/smoke
models_dir: models/smoke_lm
