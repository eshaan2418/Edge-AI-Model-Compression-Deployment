model: resnet18_cifar
dataset: cifar10
data_dir: data
batch_size: 128
num_workers: 2
device: cpu
seed: 42
checkpoint_in: models/baseline_resnet18.pt
checkpoint_out: models/pruned_eval.pt
compression:
  pruning:
    enabled: true
    amount: 0.5
  quantization:
    enabled: false
  distillation:
    enabled: false
benchmark:
  batch_size: 1
  num_threads: 4
  warmup_iters: 50
  min_warmup_s: 1.0
  iters: 1000
  min_time_s: 0.0
  process_repeats: 5
  strict_environment: true
