# Fast, fully offline CPU smoke test: synthetic data + light benchmarking.
# Uses the `fake` dataset (random CIFAR-shaped tensors) so it needs NO network
# and NO 170 MB CIFAR-10 download — the full pipeline (prune -> eval -> log to
# the experiment DB under results/smoke/) completes in seconds. Swap
# `dataset: cifar10` for a real experiment.
model: resnet18_cifar
dataset: fake
data_dir: data
batch_size: 32
num_workers: 0
device: cpu
seed: 42
limit_samples: 64
checkpoint_out: models/smoke_compressed.pt
compression:
  pruning:
    enabled: true
    amount: 0.5
  quantization:
    enabled: false
  distillation:
    enabled: false
benchmark:
  batch_size: 1
  num_threads: 1
  warmup_iters: 2
  min_warmup_s: 0.0
  iters: 10
  process_repeats: 2
  strict_environment: false
experiment_db:
  results_dir: results/smoke
  diagnostics_max_batches: 2
